<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swap Puzzle</title>
  </head>
  <body>
    <main>
      <h1>Swap Puzzle</h1>
      <form action="index.html" method="get">
        <label for="image-url">Image URL</label>
        <input id="image-url" name="url" type="url" placeholder="https://example.com/image.jpg" required>
        <button type="submit">Make puzzle</button>
      </form>
      <p>The image host must allow cross-origin requests.</p>
    </main>
  </body>
</html>
