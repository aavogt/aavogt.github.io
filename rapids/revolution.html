  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script type="module">
  // Cascadio's GLB colors differ from the original STEP COLOUR_RGB values.
  const stepColors = [
    { glb: [0, 121 / 255, 241 / 255], step: [0, 0.71831177421, 0.97546794387] },
    { glb: [230 / 255, 41 / 255, 55 / 255], step: [0.955603157106, 0.437629782502, 0.501773436191] },
    { glb: [0, 228 / 255, 48 / 255], step: [0, 0.951932222166, 0.471071252604] },
    { glb: [253 / 255, 249 / 255, 0], step: [0.996544368051, 0.989584985951, 0] },
  ];
  const stepColorBrightness = 0.5;

  await customElements.whenDefined("model-viewer");
  for (const viewer of document.querySelectorAll("model-viewer")) {
    const restoreStepColors = () => {
      for (const material of viewer.model.materials) {
        const pbr = material.pbrMetallicRoughness;
        const [r, g, b, alpha] = pbr.baseColorFactor;
        const match = stepColors.find(({ glb }) =>
          Math.hypot(r - glb[0], g - glb[1], b - glb[2]) < 0.05
        );
        if (match) pbr.setBaseColorFactor([...match.step.map(channel => channel * stepColorBrightness), alpha]);
      }
    };

    viewer.addEventListener("load", restoreStepColors, { once: true });
    if (viewer.loaded) restoreStepColors();
  }
  </script>
